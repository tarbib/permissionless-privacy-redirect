<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Permissionless Privacy Redirect</title>
  <style>
    :root { color-scheme: light dark; font: 13px/1.4 system-ui, sans-serif; }
    body { width: 300px; margin: 12px; }
    h1 { font-size: 15px; margin: 0 0 8px; }
    h2 { font-size: 13px; margin: 14px 0 2px; }
    p { margin: 4px 0 0; opacity: 0.75; }
    .site { padding: 4px 0; }
    label { display: flex; gap: 6px; align-items: center; font-weight: 600; }
    input:not([type]) { box-sizing: border-box; width: 100%; margin-top: 2px; font: inherit; }
    .site:has(input[type=checkbox]:not(:checked)) input:not([type]) { opacity: 0.5; }
  </style>
</head>
<body>
  <h1>Permissionless Privacy Redirect</h1>
  <input id="link" placeholder="Paste a link, then press Enter" aria-label="Link to open in its frontend" autofocus>
  <p>Or type <b>pr</b>, a space and the link in the address bar.</p>
  <p><a href="brave.html" target="_blank">Redirect clicked links automatically (Brave)</a></p>
  <h2>Sites</h2>
  <div id="sites"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
